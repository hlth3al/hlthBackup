<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه عملیاتی و تحلیل پیشران</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #070d17; color: #cbd5e1; font-family: Tahoma, sans-serif; }</style>
</head>
<body class="p-4 space-y-4 max-w-5xl mx-auto">
    <header class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-sky-400">سامانه جامع کنترل و پایش پیشرفته</h1>
            <p class="text-xs text-slate-400 mt-1">شناسه سیستم: 87097f6 | پایش بلادرنگ HIL</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-xs font-bold text-emerald-400">سیستم برخط (ONLINE)</span>
        </div>
    </header>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h2 class="text-sm font-bold text-emerald-400 mb-2">اتصال سخت‌افزار در حلقه (HIL)</h2>
            <p class="text-xs text-slate-300">نرخ نمونه‌برداری: 1000 Hz | تأخیر: 1.8 ms</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h2 class="text-sm font-bold text-amber-400 mb-2">بهینه‌سازی ANFIS</h2>
            <p class="text-xs text-slate-300">همگرایی مدل: 94.8% | خطای مجاز: 5.2%</p>
        </div>
    </div>
</body>
</html>
